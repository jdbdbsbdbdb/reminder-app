name: Build Reminder App APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup project
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          cp reminder-app/gradlew ./gradlew
          cp reminder-app/build.gradle ./build.gradle
          cp reminder-app/settings.gradle ./settings.gradle
          cp -r reminder-app/app ./app
          cp reminder-app/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: reminder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
